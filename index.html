function documentsPage(){return `${pageHead('Документы','Библиотека правил, инструкций и рабочих материалов.',canAdmin()?'<button class="btn" data-modal="document">＋ Добавить документ</button>':'')}<div class="card"><div class="toolbar"><input class="field" id="docSearch" placeholder="Найти документ…"><select class="field" id="docCategory"><option value="">Все категории</option>${['Правила сервера','Правила проходок','Инструкции для саппортов','Инструкции для кураторов','Материалы переаттестаций','Материалы собеседований'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="grid three" id="docRows">${documentCards(data.documents)}</div></div>`}function documentCards(rows){return rows.map(x=>`<div class="card" style="box-shadow:none"><div class="eyebrow">${esc(x.category)}</div><h2 style="margin-top:8px">${esc(x.title)}</h2><p class="muted">${esc(x.description)}</p><div class="quick">${x.url?`<a class="btn secondary" href="${esc(x.url)}" target="_blank" rel="noreferrer">Открыть ↗</a><button class="btn secondary" data-copy="${esc(x.url)}">Копировать ссылку</button>`:''}${canAdmin()?`<button class="ghost" data-edit-document="${x.id}">✎</button> <button class="ghost" data-delete-document="${x.id}">×</button>`:''}</div></div>`).join('')||'<div class="empty">Документов пока нет</div>'}

function addDays(date,n){let d=new Date((date||localDate())+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function daysUntil(date){if(!date)return null;const a=new Date(localDate()+'T00:00:00'),b=new Date(date+'T00:00:00');return Math.ceil((b-a)/86400000)}
function ensureRecertificationMember(m){if(!m)return;data.recertifications=data.recertifications||{};if(!data.recertifications[m.id]){const joined=m.joined||localDate();data.recertifications[m.id]={memberId:m.id,memberName:m.name||'',discord:m.discord||'',joined,archived:false,levels:[{name:'Базовый',assignedAt:joined,dueDate:addDays(joined,7),status:'Ожидает',master:'',passedAt:'',result:'',comment:'',attempts:[]},{name:'Средний',assignedAt:'',dueDate:'',status:'Ожидает',master:'',passedAt:'',result:'',comment:'',attempts:[]},{name:'Продвинутый',assignedAt:'',dueDate:'',status:'Ожидает',master:'',passedAt:'',result:'',comment:'',attempts:[]}]};}let r=data.recertifications[m.id];r.memberName=m.name||r.memberName;r.discord=m.discord||r.discord;r.joined=r.joined||m.joined||localDate();r.archived=false;r.levels=r.levels||[];const names=['Базовый','Средний','Продвинутый'];while(r.levels.length<3)r.levels.push({name:names[r.levels.length],status:'Ожидает',attempts:[]});r.levels.forEach((l,i)=>{l.name=names[i];l.attempts=l.attempts||[];l.status=l.status||'Ожидает'});return r}
function archiveRecertificationMember(m){if(!m)return;ensureRecertificationMember(m);data.recertifications[m.id].archived=true;data.recertifications[m.id].archivedAt=localDate()}
function recertCurrent(l){if(l.status==='Пройдена')return 'Пройдена';const days=daysUntil(l.dueDate);if(l.status==='Требуется повторная переаттестация'&&days>0)return l.status;if(l.dueDate&&days>0)return 'Ожидает';if(l.dueDate&&days===0)return 'Доступна';if(l.dueDate&&days<0)return 'Просрочена';return l.status||'Ожидает'}
function syncRecertifications(){data.recertifications=data.recertifications||{};data.members.filter(m=>m.role==='Саппорт').forEach(ensureRecertificationMember);Object.values(data.recertifications).forEach(r=>{const m=data.members.find(x=>x.id===r.memberId);if(m){r.memberName=m.name;r.discord=m.discord;r.archived=false}r.levels?.forEach((l,i)=>{if(l.status==='Пройдена'||!l.dueDate)return;const d=daysUntil(l.dueDate);if(d===0)l.status='Доступна';else if(d<0)l.status='Просрочена';});});}
function recertPage(){syncRecertifications();const all=Object.values(data.recertifications||{}).filter(r=>!r.archived||r.levels.some(l=>(l.attempts||[]).length));const rows=all.map((r,i)=>{const live=data.members.find(m=>m.id===r.memberId),levels=r.levels;return `<tr><td>${i+1}</td><td>${esc(live?.name||r.memberName)}${r.archived?' <span class="badge">Архив</span>':''}</td><td>${esc(live?.discord||r.discord||'—')}</td><td>${fmtDate(r.joined)}</td>${levels.map((l,idx)=>{let st=recertCurrent(l),days=daysUntil(l.dueDate);return `<td><div>${badge(st)}</div><small class="muted">${idx===0?'Базовый':idx===1?'Средний':'Продвинутый'}</small>${l.dueDate?`<div class="muted" style="font-size:11px">Срок: ${fmtDate(l.dueDate)}${st==='Доступна'?'':days>0?' · через '+days+' дн.':days<0?' · просрочено на '+Math.abs(days)+' дн.':''}</div>`:''}<div class="muted" style="font-size:11px">Попыток: ${(l.attempts||[]).length}</div>${!r.archived&&st!=='Пройдена'&&st!=='Ожидает'&&canAdmin()?`<button class="btn secondary" data-recert-attempt="${esc(r.memberId)}:${idx}">Провести</button>`:''}<button class="mini-link" data-recert-history="${esc(r.memberId)}:${idx}">История</button></td>`}).join('')}<td>${esc(levels.filter(l=>l.status==='Пройдена').length)}/3</td></tr>`}).join('');return `${pageHead('Переаттестации','Связаны с основной таблицей саппортов. Уровни открываются последовательно, история попыток сохраняется.', '')}<div class="notice">Базовый уровень доступен через 7 календарных дней после добавления саппорта. После успешной попытки следующий уровень открывается через 7 дней; после неудачной повторная попытка назначается через 3 дня.</div><div class="card"><div class="table-wrap"><table><thead><tr><th>№</th><th>Саппорт</th><th>Discord ID</th><th>Дата добавления</th><th>Базовый уровень</th><th>Средний уровень</th><th>Продвинутый уровень</th><th>Прогресс</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">Саппортов пока нет. Добавленные в основной таблице участники появятся здесь автоматически.</td></tr>'}</tbody></table></div></div>`}
// Override the existing page renderer only for the dedicated re-attestation page.
const _renderRecert=render;render=function(){syncRecertifications();if(page==='attestations'){setTheme();$('#topTitle').textContent='Переаттестации';$('#avatar').textContent=role[0];if(window.__VYSHKA_USER__){$('#authRole').textContent=role;$('#authName').textContent=window.__VYSHKA_USER__.username||'Discord';if(window.__VYSHKA_USER__.avatar){$('#authAvatar').src=window.__VYSHKA_USER__.avatar;$('#authAvatar').style.display='block';$('#avatar').style.display='none'}}$('#notifyCount').textContent=data.notifications.filter(n=>!n.read).length;$('#content').innerHTML=recertPage();wire();return}_renderRecert()};
const _wireRecert=wire;wire=function(){_wireRecert();
 document.querySelectorAll('[data-recert-attempt]').forEach(b=>b.onclick=()=>{if(!canAdmin()){toast('Проводить переаттестацию может только администратор.');return}const [id,idxS]=b.dataset.recertAttempt.split(':'),idx=Number(idxS),r=data.recertifications?.[id],l=r?.levels[idx];if(!r||!l)return;const status=recertCurrent(l);if(status==='Ожидает'||status==='Пройдена'){toast('Этот уровень пока недоступен.');return}if(idx>0&&r.levels[idx-1].status!=='Пройдена'){toast('Сначала необходимо пройти предыдущий уровень.');return}const result=prompt('Результат: «Пройдена» или «Не пройдена»','Пройдена');if(!result)return;const ok=['пройдена','пройдено','успешно','да'].includes(result.trim().toLowerCase());if(!ok&&!['не пройдена','не пройдено','нет','неуспешно'].includes(result.trim().toLowerCase())){toast('Укажи «Пройдена» или «Не пройдена».');return}const date=prompt('Дата проведения (ГГГГ-ММ-ДД)',localDate())||localDate(),master=prompt('Имя или Discord ID мастера',role)||role,comment=prompt('Комментарий мастера (необязательно)','')||'';const attempt={date,master,result:ok?'Пройдена':'Не пройдена',comment};l.attempts=l.attempts||[];l.attempts.push(attempt);l.master=master;l.lastAttemptAt=date;l.result=attempt.result;l.comment=comment;if(ok){l.status='Пройдена';l.passedAt=date;l.dueDate='';if(idx<2){const next=r.levels[idx+1];next.assignedAt=date;next.dueDate=addDays(date,7);next.status='Ожидает';next.master='';next.passedAt='';next.result='';next.comment=''}}else{l.status='Требуется повторная переаттестация';l.dueDate=addDays(date,3)}data.attestations=data.attestations||[];data.attestations.unshift({id:Date.now(),memberId:id,member:r.memberName, test:l.name,date,checker:master,status:attempt.result,comment,score:'',levelIndex:idx});save();log('Записана переаттестация',r.memberName,l.name+': '+attempt.result);render();toast('Результат и история сохранены')});
 document.querySelectorAll('[data-recert-history]').forEach(b=>b.onclick=()=>{const [id,idxS]=b.dataset.recertHistory.split(':'),l=data.recertifications?.[id]?.levels[Number(idxS)];if(!l)return;const text=(l.attempts||[]).map((a,i)=>`${i+1}. ${fmtDate(a.date)} — ${a.result}\nМастер: ${a.master||'—'}\nКомментарий: ${a.comment||'—'}`).join('\n\n');alert(`${l.name}: история попыток\n\n${text||'Попыток пока нет.'}`)});
};
// Existing members receive a stable shift value; no duplicate member records are created.
data.members.forEach(m=>{if(m.shift===undefined||m.shift===null||m.shift==='')m.shift='0';if(m.role==='Саппорт')ensureRecertificationMember(m)});syncRecertifications();save();
</script>
<script id="discord-auth-ui">
(function(){
 const csrf=()=>window.__VYSHKA_USER__?.csrf||'';
 async function request(url,opts={}){const headers={...(opts.headers||{})};if(opts.body)headers['Content-Type']='application/json';if(opts.method&&opts.method!=='GET')headers['X-CSRF-Token']=csrf();const r=await fetch(url,{...opts,headers,credentials:'same-origin'});const d=await r.json().catch(()=>({error:'Не удалось прочитать ответ сервера'}));if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d;}
 async function loadWhitelist(){const body=document.querySelector('#wlRows');if(!body)return;try{const d=await request('/api/admin/whitelist');const q=(document.querySelector('#wlSearch')?.value||'').toLowerCase();body.innerHTML=(d.users||[]).filter(u=>(u.username||'').toLowerCase().includes(q)||u.discordId.includes(q)).map(u=>`<tr><td><div style="display:flex;align-items:center;gap:9px">${u.avatar?`<img src="${u.avatar}" alt="" style="width:32px;height:32px;border-radius:50%">`:'<span class="avatar">?</span>'}<span>${esc(u.username||'Пользователь ещё не входил')}</span></div></td><td>${esc(u.discordId)}</td><td><select class="field wl-role" data-id="${esc(u.discordId)}">${['Администратор','Куратор','Мастер','Саппорт'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></td><td>${esc(u.addedAt?new Date(u.addedAt).toLocaleDateString('ru-RU'):'—')}</td><td><button class="ghost wl-save" data-id="${esc(u.discordId)}">Сохранить роль</button> <button class="ghost wl-remove" data-id="${esc(u.discordId)}">Удалить</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Пользователи не найдены</td></tr>';document.querySelector('#wlStatus').textContent=`Всего пользователей: ${(d.users||[]).length}`;
 body.querySelectorAll('.wl-save').forEach(b=>b.onclick=async()=>{try{const role=body.querySelector(`.wl-role[data-id="${CSS.escape(b.dataset.id)}"]`).value;await request('/api/admin/whitelist/'+encodeURIComponent(b.dataset.id),{method:'PATCH',body:JSON.stringify({role})});document.querySelector('#wlStatus').textContent='Роль обновлена.';await loadWhitelist()}catch(e){alert(e.message)}});
 body.querySelectorAll('.wl-remove').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить пользователя из белого списка? Его сессия будет отозвана.'))return;try{await request('/api/admin/whitelist/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});await loadWhitelist()}catch(e){alert(e.message)}});
 }catch(e){body.innerHTML=`<tr><td colspan="5" class="empty">${esc(e.message)}</td></tr>`}}
 document.addEventListener('click',async e=>{if(e.target.id==='wlAdd'){const id=document.querySelector('#wlId').value.trim(),role=document.querySelector('#wlRole').value;if(!/^\d{17,20}$/.test(id)){alert('Введи корректный Discord ID (17–20 цифр).');return}try{await request('/api/admin/whitelist',{method:'POST',body:JSON.stringify({discordId:id,role})});document.querySelector('#wlId').value='';await loadWhitelist()}catch(err){alert(err.message)}}if(e.target.id==='refreshWhitelist')loadWhitelist()});
 document.addEventListener('input',e=>{if(e.target.id==='wlSearch')loadWhitelist()});
 if(document.querySelector('#whitelistPanel'))loadWhitelist();
})();
</script>
